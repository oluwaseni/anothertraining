<html>
    <head>
        <title>Limehome</title>
        <link rel="stylesheet" href="limehome.css">

     

    </head>
    <body>
        <div class="whole-body">
            <div class="header">
                <h6>About</h6>
                <h6>Location</h6>
                <h6>Lease to Limehome</h6>

            </div>
            <div class="content">
                
                <div class="text-part">
                    <span class="grey-text">
                        Berlin Tauenstrasse
                    </span>
                    <h1 id="welcome">
                        Welcome Home
                    </h1>

                    <form class="search-form">
                        <div class="filter-group">
                            <select class="filter-select">
                                <option value="">-Location-</option>
                                <option value="Lagos">Lagos</option>
                                <option value="Abuja">Abuja</option>
                                <option value="Kano">Kano</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <select class="filter-select">
                                <option value=""> -Date- </option>
                                <option value="today">Today</option>
                                <option value="tomorrow">Tomorrow</option>
                                <option value="this-week">This Week</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <select class="filter-select">
                                <option value="">-Apartment-</option>
                                <option value="studio">Studio</option>
                                <option value="1-bedroom">1 Bedroom</option>
                                <option value="2-bedroom">2 Bedroom</option>
                            </select>
                        </div>
                        <input type="text" placeholder="Search home" class="search-input">
                        <button type="submit" class="search-button">Search Suites</button>      
                    </form>

                    <div class="javas">
                    <button type="submit" class="search-button" onclick="checkDriverEligibility(25, 'male', 'Nigeria')">Check Driver Eligibility</button>  
                    </div>
                    <div class="javas">
                    <button type="submit" class="search-button" onclick="approveDriverEligibility(50)">Approve All Drivers Eligibility</button>  
                    </div>
                    <p class="grey-text">
                        We are a tech company that provides fully furnished <br> apartments for short-term and long-term stays.
                    </p>

                </div>

                <div class="image-part">
                    <img src="./assets/23.avif" class="image" alt="Limehome Image">
                </div>
            </div>

        </div>


    <script src="limehome.js"></script>

    </body>

</html>
